{% extends "base.html" %}

{% block content %}
  <div class="mx-auto max-w-3xl px-4 py-8">
    <h1 class="text-2xl font-bold tracking-tight">Delete Monster</h1>

    <div class="mt-6 rounded-md border border-amber-200 bg-amber-50 px-4 py-3 text-amber-900">
      You are about to permanently delete <span class="font-semibold">{{ monster.name }}</span>. This cannot be undone.
    </div>

    <form method="post" action="/monsters/{{ monster.id }}/delete" class="mt-6 flex items-center gap-3">
      <button
        type="submit"
        class="inline-flex items-center rounded-md border border-red-800 bg-red-950 px-3 py-2 text-sm font-medium text-red-100 hover:bg-red-900"
      >
        Yes, delete
      </button>

      <a
        href="/monsters/{{ monster.id }}"
        class="inline-flex items-center rounded-md border border-gray-300 bg-white px-3 py-2 text-sm font-medium text-gray-900 hover:bg-gray-50"
      >
        Cancel
      </a>
    </form>
  </div>
{% endblock %}
